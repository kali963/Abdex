# AbdEX production stack for one server in Kazakhstan (personal data of RK citizens must be stored in RK).
#
#   cd deploy && cp .env.production.example .env.production   # fill it in (docs/launch.md)
#   ./generate-secrets.sh                                     # once: field encryption keys
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from the internet (80/443, automatic Let's Encrypt certificates). Everything else
# lives on the internal network.
#
# Monitoring (Prometheus + Alertmanager → Telegram, NFR-OBS-01) is the "monitoring" profile:
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile monitoring up -d

x-env: &env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://abdex:${APP_DB_PASSWORD}@db:5432/abdex
  REDIS_URL: redis://redis:6379/0
  CLAMAV_HOST: clamav
  EDS_NCANODE_URL: http://ncanode:14579
  STORAGE_DIR: /data/storage
  AUDIT_ARCHIVE_DIR: /data/audit-archive
  BACKUP_STATUS_FILE: /backup-status/last_success
  FIELD_ENCRYPTION_KEYS_FILE: /run/secrets/field_keys
  TRUST_PROXY: "true"
  TRUSTED_PROXY_HOPS: "1"
  SECURE_COOKIES: "true"
  SEED_DEMO_DATA: "false"
  RUN_BACKGROUND_WORKER: "false"

x-app: &app
  build: ..
  image: abdex:${ABDEX_VERSION:-latest}
  restart: unless-stopped
  env_file: .env.production
  secrets: [field_keys, audit_archive_key, metrics_token]
  volumes:
    - storage:/data/storage
    - audit_archive:/data/audit-archive
    - ${BACKUP_DIR:-/var/backups/abdex}/status:/backup-status:ro
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "10" }

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging: *logging

  app:
    <<: *app
    environment:
      <<: *env
      MIGRATE_ON_START: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *env
      MIGRATE_ON_START: "false"   # the app container migrates; the worker waits for it
    healthcheck:
      disable: true               # no web server in this container (the image check targets the app)
    depends_on:
      app: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    # OPS-05: every finished transaction log segment (WAL) is copied to /wal at once (at the latest every 5 min);
    # with the daily base backup of backup.sh this restores the database to any moment (docs/launch.md).
    entrypoint: ["sh", "-c", "mkdir -p /wal && chown postgres:postgres /wal && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200",
              "-c", "log_min_duration_statement=1000", "-c", "idle_in_transaction_session_timeout=60000",
              "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=300",
              "-c", "archive_command=test ! -f /wal/%f && cp %p /wal/%f.part && mv /wal/%f.part /wal/%f",
              "-c", "log_timezone=UTC", "-c", "timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ${BACKUP_DIR:-/var/backups/abdex}/wal:/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abdex"]
      interval: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    logging: *logging

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    # loads the signature database at start (a few minutes, ~1.5 GB RAM); uploads wait with "try again later"
    logging: *logging

  ncanode:
    image: malikzh/ncanode:latest   # pin the tested tag; needs outbound access to *.pki.gov.kz (OCSP, TSP, CRL)
    restart: unless-stopped
    expose: ["14579"]
    logging: *logging

  # --- monitoring profile -------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=30d"]
    secrets: [metrics_token]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    # the web UI only on the server itself: ssh -L 9090:127.0.0.1:9090 server
    ports: ["127.0.0.1:9090:9090"]
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-0}
    # the chat id is put into the config at start (Alertmanager does not read environment variables)
    entrypoint: ["sh", "-c", "sed \"s/__CHAT_ID__/$${ALERT_TELEGRAM_CHAT_ID}/\" /etc/alertmanager/alertmanager.yml.in > /tmp/am.yml && exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/alertmanager"]
    secrets: [alert_telegram_token]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.in:ro
    ports: ["127.0.0.1:9093:9093"]
    logging: *logging

  node-exporter:   # disk, memory, CPU of the server
    image: prom/node-exporter:v1.8.2
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@db:5432/abdex?sslmode=disable
    depends_on: [db]
    logging: *logging

secrets:
  field_keys:
    file: ./secrets/field_keys
  audit_archive_key:
    file: ./secrets/audit_archive_key
  metrics_token:
    file: ./secrets/metrics_token
  alert_telegram_token:
    file: ./secrets/alert_telegram_token

volumes:
  pgdata:
  storage:
  audit_archive:
  prometheus:
  caddy_data:
  caddy_config:
