# NFR-OBS-01: AbdEX monitoring. Scrapes the application (bearer token from the metrics_token secret), the
# server (node-exporter) and PostgreSQL (postgres-exporter); alert rules in alerts.yml go to Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: abdex
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs: [{ targets: ["app:8000"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
