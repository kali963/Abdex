# Local / pre-production stack: app + background worker + PostgreSQL.
# Start:  docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abdex
      POSTGRES_USER: abdex
      POSTGRES_PASSWORD: abdex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abdex"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://abdex:abdex@db:5432/abdex
      RUN_BACKGROUND_WORKER: "false"
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://abdex:abdex@db:5432/abdex
      SEED_DEMO_DATA: "false"
    command: ["python", "-m", "app.worker"]
    volumes:
      - storage:/data/storage
    depends_on:
      - app

volumes:
  pgdata:
  storage:
