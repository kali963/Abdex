# Local stack for trying the site on your own computer: app + background worker + PostgreSQL.
#   cp .env.example .env      # fill in INITIAL_ADMIN_* / INITIAL_USER_* (passwords of 12+ characters)
#   docker compose up -d --build   ->  http://localhost:8000
# Port 8000 taken by another program: APP_PORT=8080 (and PUBLIC_BASE_URL=http://localhost:8080) in .env.
# SMS and e-mails are not sent in this mode: the codes are on http://localhost:8000/dev/outbox.
# The production server uses deploy/docker-compose.prod.yml instead (docs/launch.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abdex
      POSTGRES_USER: abdex
      POSTGRES_PASSWORD: abdex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abdex"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://abdex:abdex@db:5432/abdex
      RUN_BACKGROUND_WORKER: "false"
    ports:
      - "${APP_PORT:-8000}:8000"   # APP_PORT in .env when 8000 is taken on this computer
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://abdex:abdex@db:5432/abdex
      MIGRATE_ON_START: "false"   # the app container migrates; the worker waits for it
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true               # no web server in this container
    volumes:
      - storage:/data/storage
    depends_on:
      app:
        condition: service_healthy

  # GOV-DS-02: verification of NCA RK signatures (NCALayer, eGov mobile, eGov Business) — CMS, chain, OCSP, TSP.
  # Start with:  docker compose --profile eds up -d   and set EDS_NCANODE_URL=http://ncanode:14579 in .env.
  # NCANode needs outbound access to ocsp.pki.gov.kz, tsp.pki.gov.kz and crl.pki.gov.kz; it is never exposed
  # to the internet (only the app talks to it). Pin the image tag you have tested.
  ncanode:
    image: malikzh/ncanode:latest
    profiles: ["eds"]
    restart: unless-stopped
    expose:
      - "14579"

volumes:
  pgdata:
  storage:
