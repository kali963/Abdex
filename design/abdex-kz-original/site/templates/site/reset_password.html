{% extends "site/base.html" %}
{% block title %}Сброс пароля | AbdEX{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-semibold mb-2">Сброс пароля</h1>
  <p class="text-gray-600 mb-6">Придумай новый пароль (минимум 6 символов).</p>

  {% if error %}
    <div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 border border-red-200">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/reset-password" class="space-y-4">
    <input type="hidden" name="token" value="{{ token or '' }}"/>

    <div>
      <label class="block text-sm font-medium mb-1">Новый пароль</label>
      <input
        type="password"
        name="password"
        class="w-full rounded-lg border px-3 py-2"
        placeholder="******"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Повтори пароль</label>
      <input
        type="password"
        name="password2"
        class="w-full rounded-lg border px-3 py-2"
        placeholder="******"
        required
      />
    </div>

    <button type="submit" class="w-full rounded-lg px-4 py-2 font-semibold"
            style="background:#44695F;color:#fff;">
      Сохранить пароль
    </button>

    <div class="text-center mt-3">
      <a href="/login" class="text-sm underline">Вернуться ко входу</a>
    </div>
  </form>
</div>
{% endblock %}
