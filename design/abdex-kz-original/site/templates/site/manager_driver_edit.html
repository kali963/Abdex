{% extends "site/base.html" %}
{% block title %}Редактировать водителя #{{ driver.id }} | AbdEX{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-semibold">Редактировать водителя #{{ driver.id }}</h1>
    <a class="cab-badge" style="text-decoration:none;" href="/manager/drivers/{{ driver.id }}">← Назад</a>
  </div>

  <form class="bg-white rounded-xl shadow overflow-hidden p-6"
        method="post"
        action="/manager/drivers/{{ driver.id }}/edit">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div class="req-field">
        <label>Форма бизнеса</label>
        <input type="text" name="business_form" value="{{ driver.business_form or '' }}">
      </div>

      <div class="req-field">
        <label>Компания/название</label>
        <input type="text" name="entity_name" value="{{ driver.entity_name or '' }}">
      </div>

      <div class="req-field">
        <label>ФИО</label>
        <input type="text" name="full_name" value="{{ driver.full_name or '' }}">
      </div>

      <div class="req-field">
        <label>Телефон</label>
        <input type="text" name="phone" value="{{ driver.phone or '' }}">
      </div>

      <div class="req-field">
        <label>ИИН</label>
        <input type="text" name="iin" value="{{ driver.iin or '' }}">
      </div>

      <div class="req-field">
        <label>№ удостоверения</label>
        <input type="text" name="id_number" value="{{ driver.id_number or '' }}">
      </div>

      <div class="req-field">
        <label>№ паспорта</label>
        <input type="text" name="passport_number" value="{{ driver.passport_number or '' }}">
      </div>

      <div class="req-field">
        <label>Авто</label>
        <input type="text" name="car" value="{{ driver.car or '' }}">
      </div>

      <div class="req-field">
        <label>Прицеп</label>
        <input type="text" name="trailer" value="{{ driver.trailer or '' }}">
      </div>

      <div class="req-field">
        <label>Грузоподъёмность (т)</label>
        <input type="number" step="0.1" name="capacity_t"
               value="{% if driver.capacity_kg is not none %}{{ (driver.capacity_kg/1000) | round(1) }}{% endif %}">
      </div>

      <div class="req-field">
        <label>Объём (м³)</label>
        <input type="number" step="0.1" name="volume_m3"
               value="{% if driver.volume_m3 is not none %}{{ driver.volume_m3 }}{% endif %}">
      </div>

      <div class="req-field md:col-span-2">
        <label>Техпаспорт №</label>
        <input type="text" name="tech_passport_number" value="{{ driver.tech_passport_number or '' }}">
      </div>

    </div>

    <div class="mt-6 flex gap-2">
      <button class="btn-main" type="submit">Сохранить</button>
      <a class="cab-badge" style="text-decoration:none;" href="/manager/drivers/{{ driver.id }}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
