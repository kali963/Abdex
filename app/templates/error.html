{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card empty">
  <b>{{ code }} · {{ message }}</b>
  <p class="muted">{{ _("error.request_id") }}: <code>{{ request.headers.get('x-request-id', '') }}</code></p>
  <div class="actions center"><a class="btn" href="/dashboard">{{ _("nav.dashboard") }}</a><a class="btn primary" href="/">{{ _("action.home") }}</a></div>
</div>
{% endblock %}
