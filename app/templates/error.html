{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card empty">
  <b>{{ code }} · {{ message }}</b>
  <p class="muted">{{ _("error.request_id") }}: <code>{{ request_id }}</code></p>
  <div class="actions center">{% if code == 401 %}<a class="btn primary" href="/login">{{ _("nav.login") }}</a>{% elif me %}<a class="btn primary" href="/dashboard">{{ _("nav.dashboard") }}</a>{% else %}<a class="btn primary" href="/">{{ _("action.home") }}</a>{% endif %}</div>
</div>
{% endblock %}
