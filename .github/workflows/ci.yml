# OPS-03 / SEC-DEV-02: lint, tests (SQLite + PostgreSQL), security scanners. Critical findings fail the build.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abdex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests --select E,F,W,B,S --ignore E501,S101,B008,S311,B904,E731 --target-version py311
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, via Alembic migrations)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/abdex_test
        run: pytest -q
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/abdex_test
        run: alembic check
      - name: SAST (bandit)
        run: bandit -q -r app -lll
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --verbose
